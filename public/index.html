<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BVB Fanseite</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--y:#FDE100;--b:#0a0a0a;--c:#151515;--l:#2a2a2a}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:#fff;font-family:'Oswald',Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;background:url(https://crests.football-data.org/4.png) center/min(85vw,720px) no-repeat;opacity:.08;z-index:-1}
header{text-align:center;padding:28px 12px 8px}h1{margin:0;color:var(--y);font-size:clamp(32px,7vw,64px);letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 25px #fde10066}
main{max-width:1100px;margin:auto;padding:12px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:#151515e6;border:1px solid var(--l);border-top:4px solid var(--y);border-radius:12px;padding:16px}
.card h2{margin:0 0 12px;color:var(--y);text-transform:uppercase;letter-spacing:2px;font-size:20px}.full{grid-column:1/-1}
.tabs button{background:none;border:1px solid var(--y);color:var(--y);padding:6px 14px;margin-right:6px;border-radius:20px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--y);color:#000}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:9px 5px;text-align:right}td:first-child,th:first-child{text-align:left}th{font-size:12px;color:#bbb;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid var(--y)}tbody tr:nth-child(even){background:#ffffff0d}tbody tr.me{background:var(--y);color:#000}td.p{color:var(--y);font-weight:700}tr.me td.p{color:#000}.pos{color:#888;display:inline-block;width:22px}tr.me .pos{color:#000}
td img{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px}tr{border-bottom:1px solid var(--l)}tr.me{background:var(--y);color:#000;font-weight:700}
.vs{display:flex;align-items:center;justify-content:center;gap:18px;text-align:center}.vs img{width:72px;height:72px;object-fit:contain}
.cd{display:flex;gap:10px;justify-content:center;margin-top:14px}.cd div{background:#000;border:1px solid var(--y);border-radius:8px;padding:8px 12px;min-width:68px;text-align:center}
.cd b{display:block;font-size:32px;color:var(--y)}.cd span{font-size:12px;text-transform:uppercase;color:#aaa}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:7px 0 0;font-size:15px;gap:10px}.m span:first-child{text-align:right}.m span:last-child{text-align:left}.sm{border-bottom:1px solid var(--l);padding-bottom:7px}
.m img{width:20px;height:20px;object-fit:contain}.m .s{background:var(--y);color:#000;font-weight:700;padding:2px 10px;border-radius:6px}
#hist{max-height:520px;overflow:auto}.sm{font-size:12px;color:#999}
#live{display:none;position:sticky;top:0;z-index:5;background:var(--y);color:#000;padding:10px 14px;text-align:center}
#live .top{font-size:clamp(18px,4vw,28px);font-weight:700}#live .ev{font-size:14px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center}
.dot{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:middle}.y{background:#ffd500;border:1px solid #000}.r{background:#e00}
.pulse{animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
#goal{position:fixed;inset:0;display:none;place-items:center;background:#000d;z-index:50;text-align:center}
#goal.on{display:grid}#goal h3{margin:0;font-size:clamp(60px,18vw,220px);color:var(--y);animation:z 1.2s ease-out infinite alternate;text-shadow:0 0 40px var(--y)}
#goal p{font-size:clamp(20px,4vw,40px);margin:0}@keyframes z{from{transform:scale(.7) rotate(-4deg)}to{transform:scale(1.1) rotate(3deg)}}
#enter{position:fixed;inset:0;z-index:99;background:#000;display:grid;place-items:center;text-align:center}
#enter button{background:var(--y);border:0;padding:18px 34px;font:700 24px Oswald;border-radius:40px;cursor:pointer;text-transform:uppercase;animation:p 1.5s infinite}
#mute{position:fixed;right:12px;bottom:12px;background:var(--y);border:0;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;z-index:10}
footer{text-align:center;color:#777;font-size:12px;padding:24px 12px}

.tabs{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;margin:0;flex:0 0 auto}
td{white-space:nowrap}td:first-child{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.card{padding:12px}.tabs button{padding:5px 10px;font-size:13px}table{font-size:13px}td,th{padding:8px 3px}th{font-size:10px;letter-spacing:0}.pos{width:18px}td img{width:18px;height:18px;margin-right:4px}}
.mw{border-bottom:1px solid var(--l)}.mw .sm{border:0;padding-bottom:7px}.mw.click{cursor:pointer}.mw.click:hover{background:#ffffff0d}
.det{display:none;padding:4px 6px 12px;font-size:14px}.mw.open .det{display:block}.dh{color:var(--y);text-transform:uppercase;font-size:12px;letter-spacing:1px;margin:6px 0 4px}
.ev2{padding:2px 0}.lu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
</style></head><body>
<div id="enter"><div><img src="https://crests.football-data.org/4.png" width="140"><h1>Echte Liebe</h1><button id="go">Los geht's!</button></div></div>
<div id="live"></div><div id="goal"><div><h3>TORRRR!</h3><p id="gtxt"></p></div></div>
<header><h1>Borussia Dortmund</h1></header>
<main>
<section class="card full" id="nextc"><h2>Nächster Gegner</h2><div id="next">Lade…</div></section>
<section class="card"><h2>Tabelle</h2><div class="tabs" id="ctabs" style="margin-bottom:8px"><button data-c="BL1" class="on">Bundesliga</button><button data-c="CL">Champions League</button></div><div class="tabs" id="ttabs"><button data-t="total" class="on">Gesamt</button><button data-t="home">Heim</button><button data-t="away">Auswärts</button></div>
<table><thead><tr><th>Team</th><th>Punkte</th><th>Sp.</th><th>S-U-N</th><th>Tore</th><th>Diff.</th></tr></thead><tbody id="tbl"></tbody></table></section>
<section class="card"><h2>BVB-Spiele</h2><div class="tabs" id="mtabs" style="margin-bottom:8px"><button data-m="past" class="on">Vergangene</button><button data-m="up">Nächste</button></div><div id="hist"></div></section>
</main>
<footer>Inoffizielle Fanseite. Borussia Dortmund, BVB und das Wappen sind Marken der Borussia Dortmund GmbH &amp; Co. KGaA. © Alle Rechte bei den jeweiligen Inhabern. Daten: football-data.org</footer>
<button id="mute">🔊</button><audio id="song" src="ole.mp3"></audio>
<script>
const BVB=4,$=s=>document.querySelector(s);let tab='total',comp='BL1',tabs={},mt='past',all=[],nextM,lastG=null;
const j=async u=>(await fetch(u)).json(),nm=t=>t.shortName||t.name||'TBD';
const fmt=d=>new Date(d).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const song=$('#song');
$('#go').onclick=()=>{$('#enter').remove();song.volume=.7;song.play().then(()=>{song.pause();song.currentTime=0}).catch(()=>{})};
$('#mute').onclick=()=>{song.muted=!song.muted;$('#mute').textContent=song.muted?'🔇':'🔊'};
const sel=(id,fn)=>document.querySelectorAll(id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll(id+' button').forEach(x=>x.classList.toggle('on',x==b));fn(b)});
sel('#ttabs',b=>{tab=b.dataset.t;drawTable()});
sel('#ctabs',b=>{comp=b.dataset.c;tab='total';document.querySelectorAll('#ttabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='total'));tabs[comp]?drawTable():loadTables()});
sel('#mtabs',b=>{mt=b.dataset.m;drawMatches()});
async function loadTables(){try{tabs[comp]=(await j('/api/tables/'+comp)).standings;drawTable()}catch(e){}}
function drawTable(){const st=tabs[comp];if(!st)return;
document.querySelectorAll('#ttabs button').forEach(b=>b.style.display=st.some(x=>x.type===b.dataset.t.toUpperCase())?'':'none');
const t=st.find(x=>x.type===tab.toUpperCase())||st[0];if(!t)return;
$('#tbl').innerHTML=t.table.map(r=>`<tr class="${r.team.id==BVB?'me':''}"><td><span class="pos">${r.position}</span><img src="${r.team.crest||''}">${nm(r.team)}</td><td class="p">${r.points}</td><td>${r.playedGames}</td><td>${r.won}-${r.draw}-${r.lost}</td><td>${r.goalsFor}:${r.goalsAgainst}</td><td>${r.goalDifference}</td></tr>`).join('')}

const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),dc={};
function detHTML(d){
 const tn=id=>esc(nm(id==d.homeTeam.id?d.homeTeam:d.awayTeam)),mi=(a,b)=>`${a??''}${b?'+'+b:''}'`;
 const ev=[...(d.goals||[]).map(g=>({m:g.minute||0,x:g.injuryTime||0,k:`${mi(g.minute,g.injuryTime)} ⚽ <b>${esc(g.scorer?.name)}</b>${g.type==='OWN'?' (Eigentor)':g.type==='PENALTY'?' (Elfmeter)':''}${g.score?` <span class="sm">${g.score.home}:${g.score.away}</span>`:''}`,t:g.team?.id})),
 ...(d.bookings||[]).map(b=>({m:b.minute||0,x:0,k:`${mi(b.minute)} <span class="dot ${b.card==='YELLOW'?'y':'r'}"></span> ${esc(b.player?.name)}${b.card==='YELLOW_RED'?' (Gelb-Rot)':''}`,t:b.team?.id}))].sort((a,b)=>a.m-b.m||a.x-b.x);
 const evH=ev.length?`<div class="dh">Tore &amp; Karten</div>`+ev.map(e=>`<div class="ev2">${e.k} <span class="sm">${e.t?tn(e.t):''}</span></div>`).join(''):'';
 const lu=t=>t.lineup?.length?`<div><div class="dh">${esc(nm(t))}${t.formation?' · '+esc(t.formation):''}</div>${t.lineup.map(p=>`<div>${p.shirtNumber??''} ${esc(p.name)}</div>`).join('')}${t.bench?.length?`<div class="sm" style="margin-top:6px">Bank: ${t.bench.map(p=>esc(p.name)).join(', ')}</div>`:''}${t.coach?.name?`<div class="sm">Trainer: ${esc(t.coach.name)}</div>`:''}</div>`:'';
 const l=lu(d.homeTeam)+lu(d.awayTeam);
 if(!evH&&!l)return'<div class="sm">Für dieses Spiel liefert die API keine Details (im kostenlosen Tarif teils nicht enthalten).</div>';
 return evH+(l?`<div class="dh" style="margin-top:10px">Aufstellung</div><div class="lu">${l}</div>`:'')}
$('#hist').addEventListener('click',async e=>{const w=e.target.closest('.mw.click');if(!w)return;
 w.classList.toggle('open');const box=w.querySelector('.det');if(!w.classList.contains('open')||box.dataset.ok)return;
 box.innerHTML='<div class="sm">Lade Details…</div>';
 try{const id=w.dataset.id;dc[id]=dc[id]||await j('/api/match/'+id);if(dc[id].error)throw 0;box.innerHTML=detHTML(dc[id]);box.dataset.ok=1}
 catch(x){box.innerHTML='<div class="sm">Details konnten nicht geladen werden.</div>'}});
function drawMatches(){const fin=all.filter(m=>m.status==='FINISHED').reverse(),up=all.filter(m=>['SCHEDULED','TIMED'].includes(m.status));
$('#hist').innerHTML=(mt==='past'?fin:up).map(row).join('')||'<div class="sm">Keine Spiele.</div>'}
const row=m=>`<div class="mw ${m.status==='FINISHED'?'click':''}" data-id="${m.id}"><div class="m"><span>${nm(m.homeTeam)} <img src="${m.homeTeam.crest}"></span><span class="s">${m.status==='FINISHED'?`${m.score.fullTime.home??'-'} : ${m.score.fullTime.away??'-'}`:new Date(m.utcDate).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</span><span><img src="${m.awayTeam.crest}"> ${nm(m.awayTeam)}</span></div><div class="sm" style="text-align:center">${m.competition?.name||''} · ${fmt(m.utcDate)}${m.status==='FINISHED'?' · 👆 Details':''}</div><div class="det"></div></div>`;
async function loadMatches(){try{const {matches}=await j('/api/matches');
all=matches;drawMatches();
nextM=matches.find(m=>['SCHEDULED','TIMED'].includes(m.status));
const live=matches.find(m=>['IN_PLAY','PAUSED','LIVE'].includes(m.status));
drawNext();live?drawLive(live):($('#live').style.display='none',lastG=null)}catch(e){}}
let shown=null;function drawNext(){const m=nextM;const key=m?m.id+m.utcDate:null;if(key&&key===shown&&$('#cd'))return;shown=key;if(!m){$('#next').textContent='Kein Spiel angesetzt.';return}
const home=m.homeTeam.id==BVB;
$('#next').innerHTML=`<div class="vs"><div><img src="${m.homeTeam.crest}"><br>${nm(m.homeTeam)}</div><b style="font-size:28px;color:var(--y)">VS</b><div><img src="${m.awayTeam.crest}"><br>${nm(m.awayTeam)}</div></div><div class="sm" style="text-align:center;margin-top:8px">${m.competition?.name||''} · ${home?'Heimspiel':'Auswärtsspiel'} · ${fmt(m.utcDate)}</div><div class="cd" id="cd"></div>`;tick()}
function tick(){const el=$('#cd');if(!el||!nextM)return;let s=Math.max(0,Math.floor((new Date(nextM.utcDate)-Date.now())/1000));
const v=[['Tage',86400],['Std',3600],['Min',60],['Sek',1]].map(([l,d])=>{const n=Math.floor(s/d);s-=n*d;return`<div><b>${String(n).padStart(2,'0')}</b><span>${l}</span></div>`});el.innerHTML=v.join('')}
setInterval(tick,1000);
async function drawLive(m){let d=m;try{d=await j('/api/match/'+m.id)}catch(e){}
const sc=d.score.fullTime,h=sc.home??0,a=sc.away??0,mine=m.homeTeam.id==BVB?h:a;
if(lastG!==null&&mine>lastG)goal(d);lastG=mine;
let min=d.status==='PAUSED'?'Halbzeit':d.minute!=null?`${d.minute}'${d.injuryTime?` +${d.injuryTime}`:''}`:'LIVE';
const ev=[...(d.goals||[]).map(g=>({m:g.minute,t:`⚽ ${g.minute}'${g.injuryTime?'+'+g.injuryTime:''} ${g.scorer?.name||''}`})),
...(d.bookings||[]).map(b=>({m:b.minute,t:`<span class="dot ${b.card==='RED'?'r':'y'}"></span> ${b.minute}' ${b.player?.name||''}`}))].sort((x,y)=>x.m-y.m);
const L=$('#live');L.style.display='block';
L.innerHTML=`<div class="top"><span class="pulse">●</span> ${min} &nbsp; ${nm(m.homeTeam)} ${h}:${a} ${nm(m.awayTeam)}</div><div class="ev">${ev.map(e=>`<span>${e.t}</span>`).join('')}</div>`}
function goal(d){const g=(d.goals||[]).slice(-1)[0];$('#gtxt').textContent=g?.scorer?.name?`${g.scorer.name} ${g.minute}'`:'Dortmund trifft!';
$('#goal').classList.add('on');song.currentTime=0;song.play().catch(()=>{});setTimeout(()=>$('#goal').classList.remove('on'),8000)}
$('#goal').onclick=()=>$('#goal').classList.remove('on');
loadTables();loadMatches();setInterval(loadMatches,20000);setInterval(loadTables,120000);
</script></body></html>
